<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>LKB Media Music — Kích hoạt</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#121d30;--line:#2a3a52;--text:#e8efff;--muted:#9aa9bf;--mint:#68e6c2;--red:#ff8594}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,#1b3150 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#123b38 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
    .card{width:min(470px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(24,36,56,.97),rgba(14,23,38,.97));box-shadow:0 28px 90px #0007}
    .mark{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#7df0d0,#31b898);color:#08211b;font-weight:900;font-size:17px;box-shadow:0 8px 25px #45d7b344}
    h1{font-size:24px;margin:20px 0 4px;letter-spacing:-.4px}.sub{color:var(--muted);margin:0 0 25px}
    label{display:block;margin-bottom:8px;color:#c5d0e1;font-size:13px;font-weight:600}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#0c1422;color:var(--text);font:600 15px ui-monospace,Consolas,monospace;letter-spacing:1px;text-transform:uppercase}
    input:focus{outline:2px solid var(--mint);outline-offset:2px}
    button{width:100%;margin-top:14px;padding:12px 16px;border:0;border-radius:11px;background:linear-gradient(120deg,#7df0d0,#53d6b4);color:#08211b;font-weight:800;font-size:14px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.hint{margin:17px 0 0;color:var(--muted);font-size:12px}.status{min-height:24px;margin-top:12px;color:var(--red);font-size:13px}.status.ok{color:var(--mint)}
    footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);color:#71839b;font-size:11px}
    @media(max-width:480px){.card{padding:25px 21px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">LKB</div>
    <h1>LKB Media Music</h1>
    <p class="sub">Nhập key bản quyền để mở Playlist Mix Builder.</p>
    <form id="activateForm">
      <label for="licenseCode">Mã kích hoạt</label>
      <input id="licenseCode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LKB-••••••••••••••••••••••••••" required>
      <button id="activateButton" type="submit">KÍCH HOẠT VÀO WEB</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
    <p class="hint">Key được kiểm tra trực tuyến. Mã có hạn bắt đầu tính từ lần kích hoạt đầu tiên.</p>
    <footer>Playlist Mix Builder · LKB Media Music</footer>
  </main>
  <script>
    const form=document.getElementById("activateForm");
    const code=document.getElementById("licenseCode");
    const button=document.getElementById("activateButton");
    const statusBox=document.getElementById("status");
    fetch("/api/session",{cache:"no-store"}).then(r=>{if(r.ok)location.replace("/app");}).catch(()=>{});
    code.addEventListener("input",()=>{code.value=code.value.toUpperCase();});
    form.addEventListener("submit",async event=>{
      event.preventDefault();button.disabled=true;statusBox.className="status";statusBox.textContent="Đang xác minh key...";
      try{
        const response=await fetch("/api/license/activate",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({code:code.value})});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||"Không kích hoạt được key.");
        statusBox.className="status ok";statusBox.textContent="Kích hoạt thành công. Đang mở ứng dụng...";
        location.replace("/app");
      }catch(error){statusBox.textContent=error.message||"Không kết nối được máy chủ.";button.disabled=false;}
    });
  </script>
</body>
</html>
